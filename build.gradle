plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

group = 'com.yourname.staminaaddon'
version = '1.0-SNAPSHOT'

base {
    archivesName = 'staminaaddon'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'

    // Автоматическое создание refmap для Mixin
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'DEBUG'
            arg "-mixin.config=staminaaddon.mixins.json"
            mods {
                staminaaddon {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'DEBUG'
            arg "-mixin.config=staminaaddon.mixins.json"
            mods {
                staminaaddon {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, "staminaaddon.refmap.json"
    config "staminaaddon.mixins.json"
}

sourceSets.main.resources { srcDir 'src/main/generated' }

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.20'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    
    // Подключаем Immersive Stamina для компиляции
    implementation fg.deobf(files('libs/immersive_stamina.jar'))
}
jar {
    manifest {
        attributes([
                "Specification-Title"     : "staminaaddon",
                "Specification-Vendor"    : "yourname",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "yourname",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "TweakClass"              : "org.spongepowered.asm.launch.MixinTweaker",
                "TweakOrder"              : "0",
                "MixinConfigs"            : "staminaaddon.mixins.json"
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
