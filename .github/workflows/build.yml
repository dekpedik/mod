name: Build Minecraft Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой в интерфейсе

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем код из репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Настраиваем Java 17 (подходит для Minecraft 1.20.1)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Кешируем и настраиваем Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 4. Даем права на выполнение скрипту Gradle
      - name: Make gradlew executable
        run: chmod +x gradlew

      # 5. Запускаем сборку мода
      - name: Build with Gradle
        run: ./gradlew build

      # 6. Сохраняем готовый .jar файл в артефакты
      - name: Upload Built Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Mod-Jar
          path: build/libs/*.jar
